name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Compile and run simulation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile simulation scripts
        run: |
          python -m py_compile entropy_agency_sim_v0_2.py
          python -m py_compile entropy_agency_v0_2_albedo_sensitivity.py
          python -m py_compile run_parameter_sweep.py

      - name: Run six-scenario smoke test
        run: |
          python entropy_agency_sim_v0_2.py \
            --generations 2 \
            --replicates 1 \
            --seed 123 \
            --output-dir ci-smoke-output

      - name: Run parameter-sweep smoke test
        run: |
          python run_parameter_sweep.py \
            --design screening \
            --factors stellar_flux_multiplier,cognitive_cost_multiplier \
            --scenarios cognition_pair \
            --generations 2 \
            --replicates 1 \
            --seed 123 \
            --output-dir ci-sweep-output

      - name: Validate simulation and sweep outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np
          import pandas as pd

          out = Path("ci-smoke-output")
          timeseries = pd.read_csv(out / "entropy_agency_v0_2_timeseries.csv")
          summary = pd.read_csv(out / "entropy_agency_v0_2_final_summary.csv")
          ablation = pd.read_csv(out / "entropy_agency_v0_2_cognitive_ablation.csv")
          metadata = json.loads((out / "entropy_agency_v0_2_metadata.json").read_text())

          assert len(timeseries) > 0, "Time series is empty"
          assert summary["scenario_key"].nunique() == 6, "Expected all six scenarios"
          assert len(summary) == 6, "Expected one summary row per scenario"
          assert len(ablation) == 2, "Expected two paired cognitive-ablation rows"
          assert metadata["version"] == "0.2", "Unexpected model version"

          numeric_columns = [
              "population",
              "biotic_power_harnessed_TW",
              "biotic_power_per_entity_GW",
              "delta_radiative_entropy_percent",
          ]
          for column in numeric_columns:
              assert np.isfinite(timeseries[column]).all(), f"Non-finite values in {column}"

          sweep = Path("ci-sweep-output")
          cases = pd.read_csv(sweep / "parameter_cases.csv")
          results = pd.read_csv(sweep / "sweep_replicate_results.csv")
          effects = pd.read_csv(sweep / "sweep_effects.csv")
          manifest = json.loads((sweep / "sweep_manifest.json").read_text())
          assert len(cases) == 5, f"Expected baseline plus four perturbations, got {len(cases)}"
          assert len(results) == 10, f"Expected 5 cases × 2 scenarios × 1 replicate, got {len(results)}"
          assert not effects.empty, "Sweep effects table is empty"
          assert manifest["design"] == "screening"

          print(f"Validated {len(timeseries)} ordinary simulation rows.")
          print(f"Validated {len(cases)} sweep cases and {len(results)} sweep runs.")
          PY
