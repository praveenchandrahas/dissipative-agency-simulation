name: Information versus movement ablation
on:
  push:
    branches: [experiment/information-movement-ablation]
    paths:
      - "entropy_agency_sim_v0_2.py"
      - "run_information_movement_ablation.py"
      - ".github/workflows/information-movement-ablation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib
      - name: Compile model and runner
        run: |
          python -m py_compile entropy_agency_sim_v0_2.py run_information_movement_ablation.py
      - name: Smoke test both experimental stages
        run: python run_information_movement_ablation.py --smoke --output-dir information_movement_smoke
      - name: Run full two-stage experiment
        run: python run_information_movement_ablation.py
      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: information-movement-ablation-results
          path: information_movement_results/
          retention-days: 90