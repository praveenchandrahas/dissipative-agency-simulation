name: Navigation policy ablation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigation-policy-ablation
  cancel-in-progress: true

jobs:
  run-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out navigation-policy branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib
      - name: Compile model and experiment runner
        run: |
          python -m py_compile entropy_agency_sim_v0_2.py
          python -m py_compile run_navigation_policy_ablation.py
      - name: Run smoke test
        run: |
          python run_navigation_policy_ablation.py --smoke --output-dir navigation_policy_smoke
      - name: Run full two-stage experiment
        run: python run_navigation_policy_ablation.py
      - name: Upload full results
        uses: actions/upload-artifact@v4
        with:
          name: navigation-policy-ablation-results
          path: navigation_policy_results/
          retention-days: 90
